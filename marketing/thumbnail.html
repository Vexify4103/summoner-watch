<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* Store thumbnail: shown small, so few, large elements. */
  .logo { position: absolute; left: 120px; top: 150px; width: 640px; height: 640px; border-radius: 90px;
          box-shadow: 0 30px 120px rgba(73, 184, 255, 0.35), 0 0 0 2px rgba(232, 179, 58, 0.25); }
  .right { position: absolute; left: 860px; top: 215px; width: 1000px; }
  .right h1 { font-size: 112px; letter-spacing: -2px; white-space: nowrap; }
  .right .tag { margin-top: 24px; font-size: 38px; white-space: nowrap; }
  .keys3 { margin-top: 56px; display: flex; gap: 30px; }
  .keys3 .key { width: 210px; height: 210px; border-radius: 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 3px #000; }
</style></head>
<body>
  <img class="logo" src="../assets/icon.png">
  <div class="right">
    <h1>Summoner <span class="gold">Watch</span></h1>
    <div class="tag">Enemy summoner timers for League of Legends</div>
    <div class="keys3">
      <div class="key"><img src="keys/k0.svg"></div>
      <div class="key"><img src="keys/k2.svg"></div>
      <div class="key"><img src="keys/k3.svg"></div>
    </div>
  </div>
</body></html>
