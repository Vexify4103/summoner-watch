# Settings come from deploy/.env (copy deploy/.env.example; never commit .env).
services:
  relay:
    build:
      context: ..
      # deploy/Dockerfile.prebuilt packages a binary built on another machine.
      dockerfile: ${RELAY_DOCKERFILE:-deploy/Dockerfile}
    restart: unless-stopped
    environment:
      # Empty = public relay. For a private relay: a random 32-character hex key.
      SUMMONER_RELAY_KEY: ${SUMMONER_RELAY_KEY:-}
      # Real client IP from the reverse proxy, for per-IP limits. Trusted only from
      # loopback/private addresses. Behind Cloudflare use CF-Connecting-IP.
      SUMMONER_RELAY_IP_HEADER: ${SUMMONER_RELAY_IP_HEADER:-X-Forwarded-For}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    ports:
      - "127.0.0.1:8787:8787"

  # Cloudflare Tunnel: HTTPS without port forwarding. Enabled by
  # COMPOSE_PROFILES=tunnel in deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in deploy/.env}
    depends_on: [relay]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
