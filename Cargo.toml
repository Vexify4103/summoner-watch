[package]
name = "summoner-watch"
version = "0.1.6"
edition = "2021"
description = "Stream Deck plugin: manual enemy summoner spell timers for League of Legends"
default-run = "summoner-watch"

[features]
relay = ["dep:tiny_http"]

[[bin]]
name = "summoner-watch-relay"
path = "src/bin/relay.rs"
required-features = ["relay"]

[dependencies]
tungstenite = "0.24"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
tiny_http = { version = "0.12", optional = true }
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Media_Audio", "Win32_Foundation"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
