[package]
name = "summoner-watch"
version = "0.1.1"
edition = "2021"
description = "Stream Deck plugin: manual enemy summoner spell timers for League of Legends"

[dependencies]
tungstenite = "0.24"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Media_Audio", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
